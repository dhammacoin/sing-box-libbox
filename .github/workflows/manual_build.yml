name: Manual Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Поднимаем версию, как просит лог

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies and Build
        run: |
          # Установка инструментов и критически важного пакета bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          
          # Очистка и загрузка модулей
          go mod tidy
          
          # Сборка. Мы используем флаг ./constant, так как на твоем скриншоте 
          # папка constant видна в корне проекта.
          gomobile bind -v -androidapi 21 -ldflags="-s -w" ./constant
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-lib
          path: ./*.aar
