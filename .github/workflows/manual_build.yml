name: Manual Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix and Build
        run: |
          # 1. Устанавливаем всё, на что он ругался в логах
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          
          # 2. Подтягиваем зависимости самого проекта
          go mod tidy
          
          # 3. Собираем. Используем флаг ./constant, так как эта папка у тебя есть
          gomobile bind -v -androidapi 21 -ldflags="-s -w" ./constant
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: ./*.aar
