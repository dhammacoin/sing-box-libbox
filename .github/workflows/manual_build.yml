name: Manual Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Обновили до версии, которую просит лог
          check-latest: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools and Dependencies
        run: |
          # Устанавливаем gomobile и принудительно подтягиваем пакет bind
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          
          # Очищаем модули и скачиваем зависимости
          go mod tidy

      - name: Build AAR
        run: |
          # Собираем пакет constant (он виден на твоем скриншоте 18:40)
          gomobile bind -v -androidapi 21 -ldflags="-s -w" ./constant
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: ./*.aar
