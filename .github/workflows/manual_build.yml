name: Manual Android Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' # Устанавливаем версию, которую требует твой лог
          check-latest: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools and Dependencies
        run: |
          # 1. Принудительно ставим инструменты и тот самый 'bind'
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          
          # 2. Обновляем модули проекта
          go mod tidy

      - name: Build AAR
        run: |
          # 3. Собираем библиотеку из папки constant (она видна у тебя в корне)
          gomobile bind -v -androidapi 21 -ldflags="-s -w" ./constant
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-lib
          path: ./*.aar
